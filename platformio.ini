; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ---------------------------------------------------------------------------
; Native USB (USB-Serial/JTAG) - "langsung USB ke ESP32-C3", tanpa USB-TTL
;   ARDUINO_USB_MODE=1        -> pakai peripheral USB-Serial/JTAG internal C3
;   ARDUINO_USB_CDC_ON_BOOT=1 -> object "Serial" = HWCDC (port USB bawaan)
; Upload & monitor lewat kabel USB ke port USB DevKitM-1 (GPIO18/GPIO19).
; ---------------------------------------------------------------------------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

upload_speed = 921600
monitor_speed = 115200
; native USB CDC tidak memakai line DTR/RTS
monitor_rts = 0
monitor_dtr = 0
monitor_filters = direct
